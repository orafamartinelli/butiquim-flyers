# CAPAS DE CARROSSEL (11/11/2026) — todo carrossel da fila que começa com vídeo ganha capa = último quadro do vídeo
# (o 1º quadro é vazio/preto e vira a miniatura da grade). scripts/capas-carrossel.mjs. Sem trabalho → para em ~15 s.
# De hora em hora das 7h às 22h (BRT) — pega também o que o montador da esteira e a agenda do designer criam.
name: capas-carrossel

on:
  schedule:
    - cron: "5 10-23,0,1 * * *"
  workflow_dispatch:

concurrency:
  group: capas-carrossel
  cancel-in-progress: false

jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: tem carrossel começando com vídeo?
        id: checa
        run: node scripts/capas-carrossel.mjs --checar

      - name: ffmpeg
        if: steps.checa.outputs.tem == 'sim'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: aplica capas
        if: steps.checa.outputs.tem == 'sim'
        run: node scripts/capas-carrossel.mjs --gravar
